spring.application.name=donatrack-servicio-consultas
server.port=${PORT:8085}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/donatrack_read}
spring.rabbitmq.addresses=${RABBITMQ_URL:}
spring.rabbitmq.listener.simple.auto-startup=${READ_MODEL_MESSAGING_ENABLED:false}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
donatrack.read-model.messaging.enabled=${READ_MODEL_MESSAGING_ENABLED:false}
donatrack.read-model.queue=${READ_MODEL_QUEUE:donatrack.readmodel.events}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${DD_SERVICE:donatrack-servicio-consultas}
management.metrics.tags.env=${DD_ENV:prod}
management.datadog.metrics.export.enabled=${DATADOG_ENABLED:false}
management.datadog.metrics.export.api-key=${DATADOG_API_KEY:}
management.datadog.metrics.export.uri=${DATADOG_URI:https://api.datadoghq.com}
management.datadog.metrics.export.step=${DATADOG_STEP:30s}
