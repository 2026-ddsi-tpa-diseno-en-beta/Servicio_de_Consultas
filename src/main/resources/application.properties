spring.application.name=donatrack-servicio-consultas
server.port=${PORT:8085}
spring.data.mongodb.uri=${MONGODB_URI:}
spring.rabbitmq.addresses=${RABBITMQ_URL:}
spring.rabbitmq.listener.simple.auto-startup=${READ_MODEL_MESSAGING_ENABLED:false}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=10
donatrack.read-model.messaging.enabled=${READ_MODEL_MESSAGING_ENABLED:false}
donatrack.read-model.queue=${READ_MODEL_QUEUE:donatrack.readmodel.v1.events}

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# TAGS GENERALES
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=${APP_ENV:prod}

# GRAFANA CLOUD - OTLP
management.otlp.metrics.export.enabled=${GRAFANA_OTLP_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${GRAFANA_OTLP_METRICS_URL:}
management.otlp.metrics.export.headers.Authorization=${GRAFANA_OTLP_HEADERS:}
management.otlp.metrics.export.step=${GRAFANA_OTLP_STEP:30s}
management.otlp.metrics.export.aggregation-temporality=cumulative

# DESACTIVAR DATADOG
management.datadog.metrics.export.enabled=false
